name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Vault ${{ github.ref_name }}
          releaseBody: |
            The first stable release of Vault: a secure, offline-first desktop vault for secrets and sensitive text.

            Highlights:
            - Argon2id master key derivation and AES-256-GCM encryption for every stored item.
            - API keys, passwords, tokens, SSH keys, recovery codes, notes, JSON, and .env data.
            - Search, categories, tags, favorites, reveal/hide, copy, edit, and delete.
            - Password-protected .vault export/import for device migration.
            - Five-minute auto-lock and 30-second clipboard cleanup after copying a secret.
            - Signed Tauri artifacts and updater metadata when signing secrets are configured.

            Full notes: RELEASE_NOTES_v1.0.0.md
          releaseDraft: false
          prerelease: false
